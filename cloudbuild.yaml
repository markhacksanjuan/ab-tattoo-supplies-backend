# =============================================
# AB-Tattoo Backend - Google Cloud Build
# =============================================
# Builds and deploys both Medusa and User-API to Cloud Run.
#
# Prerequisites:
#   1. Enable APIs: Cloud Build, Cloud Run, Artifact Registry, Secret Manager
#      gcloud services enable cloudbuild.googleapis.com run.googleapis.com artifactregistry.googleapis.com secretmanager.googleapis.com
#
#   2. Create Artifact Registry repository:
#      gcloud artifacts repositories create abtattoo --repository-format=docker --location=${_REGION} --description="AB-Tattoo Docker images"
#
#   3. Create secrets in Secret Manager (see backend/DEPLOY_GCP.md for full list):
#      gcloud secrets create DATABASE_URL --data-file=-  <<< "postgresql://..."
#      gcloud secrets create REDIS_URL --data-file=-  <<< "redis://..."
#      ... (repeat for all secrets)
#
#   4. Grant Cloud Build permission to deploy to Cloud Run:
#      gcloud projects add-iam-policy-binding ${PROJECT_ID} \
#        --member="serviceAccount:$(gcloud projects describe ${PROJECT_ID} --format='value(projectNumber)')@cloudbuild.gserviceaccount.com" \
#        --role="roles/run.admin"
#      gcloud iam service-accounts add-iam-policy-binding \
#        $(gcloud projects describe ${PROJECT_ID} --format='value(projectNumber)')-compute@developer.gserviceaccount.com \
#        --member="serviceAccount:$(gcloud projects describe ${PROJECT_ID} --format='value(projectNumber)')@cloudbuild.gserviceaccount.com" \
#        --role="roles/iam.serviceAccountUser"
#
#   5. Grant Cloud Build access to secrets:
#      gcloud projects add-iam-policy-binding ${PROJECT_ID} \
#        --member="serviceAccount:$(gcloud projects describe ${PROJECT_ID} --format='value(projectNumber)')@cloudbuild.gserviceaccount.com" \
#        --role="roles/secretmanager.secretAccessor"
#
# Usage:
#   # Deploy both services:
#   gcloud builds submit --config=backend/cloudbuild.yaml --substitutions=_PROJECT_ID=your-project-id .
#
#   # Deploy only medusa:
#   gcloud builds submit --config=backend/cloudbuild.yaml --substitutions=_PROJECT_ID=your-project-id,_DEPLOY_MEDUSA=true,_DEPLOY_USER_API=false .
#
#   # Deploy only user-api:
#   gcloud builds submit --config=backend/cloudbuild.yaml --substitutions=_PROJECT_ID=your-project-id,_DEPLOY_MEDUSA=false,_DEPLOY_USER_API=true .

substitutions:
  _PROJECT_ID: "${PROJECT_ID}"
  _REGION: "europe-west1"
  _REGISTRY: "europe-west1-docker.pkg.dev"
  _REPO: "abtattoo"
  _MEDUSA_SERVICE: "abtattoo-medusa"
  _USER_API_SERVICE: "abtattoo-user-api"
  _DEPLOY_MEDUSA: "true"
  _DEPLOY_USER_API: "true"
  _CLOUDSQL_INSTANCE: "abtattoo-postgres"
  _VPC_CONNECTOR: "abtattoo-connector"
  _TAG: "latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
  substitution_option: ALLOW_LOOSE

steps:
  # =============================================
  # Step 1: Build Medusa Docker image
  # =============================================
  - id: "build-medusa"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGISTRY}/${_PROJECT_ID}/${_REPO}/${_MEDUSA_SERVICE}:${_TAG}"
      - "-t"
      - "${_REGISTRY}/${_PROJECT_ID}/${_REPO}/${_MEDUSA_SERVICE}:latest"
      - "-f"
      - "backend/medusa/Dockerfile"
      - "backend/medusa"
    waitFor: ["-"]

  # =============================================
  # Step 2: Build User-API Docker image
  # =============================================
  - id: "build-user-api"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGISTRY}/${_PROJECT_ID}/${_REPO}/${_USER_API_SERVICE}:${_TAG}"
      - "-t"
      - "${_REGISTRY}/${_PROJECT_ID}/${_REPO}/${_USER_API_SERVICE}:latest"
      - "-f"
      - "backend/user-api/Dockerfile"
      - "backend/user-api"
    waitFor: ["-"]

  # =============================================
  # Step 3: Push Medusa image to Artifact Registry
  # =============================================
  - id: "push-medusa"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "${_REGISTRY}/${_PROJECT_ID}/${_REPO}/${_MEDUSA_SERVICE}"
    waitFor: ["build-medusa"]

  # =============================================
  # Step 4: Push User-API image to Artifact Registry
  # =============================================
  - id: "push-user-api"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "${_REGISTRY}/${_PROJECT_ID}/${_REPO}/${_USER_API_SERVICE}"
    waitFor: ["build-user-api"]

  # =============================================
  # Step 5: Deploy Medusa to Cloud Run
  # =============================================
  - id: "deploy-medusa"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [ "${_DEPLOY_MEDUSA}" != "true" ]; then
          echo "⏭️  Skipping Medusa deployment"
          exit 0
        fi
        echo "🚀 Deploying Medusa to Cloud Run..."
        gcloud run deploy ${_MEDUSA_SERVICE} \
          --image=${_REGISTRY}/${_PROJECT_ID}/${_REPO}/${_MEDUSA_SERVICE}:${_TAG} \
          --region=${_REGION} \
          --platform=managed \
          --port=9000 \
          --memory=2Gi \
          --cpu=2 \
          --min-instances=0 \
          --max-instances=3 \
          --timeout=300 \
          --concurrency=80 \
          --cpu-boost \
          --allow-unauthenticated \
          --startup-probe="httpGet.path=/health,httpGet.port=9000,initialDelaySeconds=10,timeoutSeconds=10,periodSeconds=10,failureThreshold=30" \
          --set-env-vars="NODE_ENV=production" \
          --update-secrets="\
        DATABASE_URL=DATABASE_URL:latest,\
        REDIS_URL=REDIS_URL:latest,\
        JWT_SECRET=JWT_SECRET:latest,\
        COOKIE_SECRET=COOKIE_SECRET:latest,\
        STRIPE_API_KEY=STRIPE_API_KEY:latest,\
        STORE_CORS=STORE_CORS:latest,\
        ADMIN_CORS=ADMIN_CORS:latest,\
        AUTH_CORS=AUTH_CORS:latest,\
        MEDUSA_BACKEND_URL=MEDUSA_BACKEND_URL:latest,\
        MEDUSA_ADMIN_EMAIL=MEDUSA_ADMIN_EMAIL:latest,\
        MEDUSA_ADMIN_PASSWORD=MEDUSA_ADMIN_PASSWORD:latest,\
        S3_FILE_URL=S3_FILE_URL:latest,\
        S3_ACCESS_KEY_ID=S3_ACCESS_KEY_ID:latest,\
        S3_SECRET_ACCESS_KEY=S3_SECRET_ACCESS_KEY:latest,\
        S3_REGION=S3_REGION:latest,\
        S3_BUCKET=S3_BUCKET:latest,\
        S3_ENDPOINT=S3_ENDPOINT:latest"
    waitFor: ["push-medusa"]

  # =============================================
  # Step 6: Deploy User-API to Cloud Run
  # =============================================
  - id: "deploy-user-api"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [ "${_DEPLOY_USER_API}" != "true" ]; then
          echo "⏭️  Skipping User-API deployment"
          exit 0
        fi
        echo "🚀 Deploying User-API to Cloud Run..."
        gcloud run deploy ${_USER_API_SERVICE} \
          --image=${_REGISTRY}/${_PROJECT_ID}/${_REPO}/${_USER_API_SERVICE}:${_TAG} \
          --region=${_REGION} \
          --platform=managed \
          --port=8000 \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=3 \
          --timeout=60 \
          --concurrency=80 \
          --allow-unauthenticated \
          --vpc-connector=${_VPC_CONNECTOR} \
          --vpc-egress=all-traffic \
          --update-secrets="\
        MONGODB_URL=MONGODB_URL:latest,\
        JWT_SECRET=USER_API_JWT_SECRET:latest,\
        CORS_ORIGINS=CORS_ORIGINS:latest,\
        MEDUSA_BACKEND_URL=MEDUSA_BACKEND_URL:latest,\
        MEDUSA_PUBLISHABLE_KEY=MEDUSA_PUBLISHABLE_KEY:latest,\
        MEDUSA_ADMIN_EMAIL=MEDUSA_ADMIN_EMAIL:latest,\
        MEDUSA_ADMIN_PASSWORD=MEDUSA_ADMIN_PASSWORD:latest,\
        GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,\
        GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,\
        GOOGLE_REDIRECT_URI=GOOGLE_REDIRECT_URI:latest,\
        FRONTEND_URL=FRONTEND_URL:latest"
    waitFor: ["push-user-api"]

images:
  - "${_REGISTRY}/${_PROJECT_ID}/${_REPO}/${_MEDUSA_SERVICE}:${_TAG}"
  - "${_REGISTRY}/${_PROJECT_ID}/${_REPO}/${_MEDUSA_SERVICE}:latest"
  - "${_REGISTRY}/${_PROJECT_ID}/${_REPO}/${_USER_API_SERVICE}:${_TAG}"
  - "${_REGISTRY}/${_PROJECT_ID}/${_REPO}/${_USER_API_SERVICE}:latest"

timeout: "1800s"
